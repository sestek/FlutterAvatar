    <script>
      // WebView için mikrofon erişimi
      async function requestMicrophoneAccess() {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ 
              audio: true, 
              video: false 
            });
            console.log('Mikrofon erişimi başarılı');
            return stream;
          }
        } catch (err) {
          console.log('Mikrofon erişimi hatası:', err);
        }
      }
      
      // Sayfa yüklendiğinde mikrofon erişimi iste
      document.addEventListener('DOMContentLoaded', function() {
        requestMicrophoneAccess();
      });
      
      window.sestekInitConfig = {
        customMetaData: {
          userId: "123456",
        },
        initialOptionsData: "Type Here... ", //placeholder text to be written to input
        chatPageTitle: "AjmanBank Virtual Agent", //text to be placed on the top bar only when the chat screen opens
        channel: "kiosk", //required field specify on which platform you will run it
        vaCredentialId: "43b29cf7-c07e-4e7d-becd-aadda22cd7e8", //required field
        dataFlowCredentialID: "8991f806-3979-4e8d-bf52-b5869558ff1e", //required field

        projectName: "AjmanBankFullLLM", //required field VA projecet name

        enableAvatar: true, //required field ,
        connectionUrl: "https://api-eu.uneeq.io", //uneeq connection address
        personaId: "f62732f4-513b-4323-8aa7-da35e1e72746", //required field
        sestektts: true, //required field sesstek tts use
        defaultLanguage: "en-US", //required field
        dataFlowProjectName: "avatar",
        dataFlowTenantId: "3a1a7b64-53b1-7074-9e91-b03f0baaef85",
        dataFlowTokenCredential:

        // socketUrl:'wss://dataflow.example.knovvu.com' //for test environment
      };
    </script>
    <script>
      window.addEventListener("message", (event) => {
        if (event.data?.type === "CLOSE_CHAT") {
          const iframe = document.querySelector("iframe");
          if (iframe) iframe.remove();

          console.log("Chat asked to close");
        }
        if (event.data?.type === "handleRedirect") {
